<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route map</title>
  {% load static %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="{% static 'routes/map.css' %}">
</head>
<body>
  <main>
    <h1>Route map</h1>
    <p id="map-status" data-state="{{ map_state }}">{{ error_message }}</p>
    <section id="summary" hidden>
      <h2>Trip totals</h2>
      <dl id="totals"></dl>
      <p id="assumptions"></p>
      <p>Displayed quantities and stop costs are rounded; the API retains full precision.</p>
    </section>
    <div id="map" aria-label="Interactive map of the planned route"></div>
    <p id="tile-note">
      Map tiles are requested by the browser from OpenTopoMap and are separate from
      server-side routing provider calls.
    </p>
  </main>
  {{ plan|json_script:"plan-data" }}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="{% static 'routes/map.js' %}"></script>
</body>
</html>
